<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>StreamPlayer 出力</title>
  <link rel="stylesheet" href="output.css">
</head>
<body data-mode="window">
  <div id="idle" class="layer"><img id="idle-image" alt="" hidden></div>
  <div id="video-layer" class="layer" hidden></div>
  <div id="youtube-layer" class="layer" hidden></div>
  <div id="vimeo-layer" class="layer" hidden></div>

      <div id="teleop-title" class="teleop-title">—</div>
      <div id="teleop-time" class="teleop-time">0:00 / 0:00</div>
    </div>
  </div>
  <script src="output.js"></script>
</body>
</html>
