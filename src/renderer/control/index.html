<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>StreamPlayer</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">StreamPlayer</div>
    <div class="output-controls">
      <div class="output-group">
        <label class="output-label">出力モード</label>
        <select id="output-mode" class="output-select">
          <option value="window">ウィンドウ（Zoom等で画面共有）</option>
          <option value="fullscreen">全画面（配信機材に出力）</option>
        </select>
      </div>
      <div class="output-group" id="output-display-group">
        <label class="output-label">出力先ディスプレイ</label>
        <select id="output-display" class="output-select"></select>
      </div>
      <button id="btn-toggle-output" type="button" class="output-btn" title="出力ウィンドウの表示/非表示 (Ctrl+O)">出力ウィンドウ: 表示</button>
    </div>
    <button id="btn-browser" type="button" title="ブラウザウィンドウを開く">🌐 ブラウザ</button>
    <button id="btn-settings" type="button">設定</button>
  </header>

  <main class="layout">
    <!-- メインライン -->
    <section class="panel" id="main-panel">
      <div class="panel-head">
        <h2>メイン</h2>
        <span class="sub">出力画面に表示</span>
      </div>
      <div class="preview">
        <img id="preview" alt="出力画面のプレビュー" hidden>
        <div id="preview-off" class="preview-off">プレビューは停止中です</div>
      </div>
      <div class="now">
        <span id="main-state" class="badge">待機</span>
        <span id="main-title" class="now-title">—</span>
      </div>
      <div class="seek">
        <span id="main-time" class="time">0:00</span>
        <input id="main-seek" type="range" min="0" max="1000" value="0" disabled>
        <span id="main-duration" class="time">0:00</span>
      </div>
      <div class="transport">
        <button id="main-prev" type="button" class="icon">⏮</button>
        <button id="main-play" type="button" class="icon primary">▶</button>
        <button id="main-stop" type="button" class="icon">⏹</button>
        <button id="main-next" type="button" class="icon">⏭</button>
        <div class="volume">
          <button id="main-mute" type="button" class="icon small" title="ミュート">🔊</button>
          <input id="main-volume" type="range" min="0" max="100">
          <span id="main-volume-value" class="vol-value">80</span>
        </div>
      </div>
      <div class="add-row">
        <button id="main-add-file" type="button">＋ ファイル</button>
        <input id="main-url" type="text" placeholder="YouTube / Vimeo の URL を貼り付けて Enter">
        <button id="main-add-url" type="button">URL を追加</button>
      </div>
      <ul id="main-list" class="playlist" data-empty="ここに動画・音声ファイルや URL をドラッグ＆ドロップ"></ul>
    </section>

    <!-- BGM ライン -->
    <section class="panel" id="bgm-panel">
      <div class="panel-head">
        <h2>BGM</h2>
        <span id="duck-indicator" class="duck" hidden>ダッキング中</span>
      </div>
      <div class="now">
        <span id="bgm-state" class="badge">停止</span>
        <span id="bgm-title" class="now-title">—</span>
      </div>
      <div class="seek">
        <span id="bgm-time" class="time">0:00</span>
        <input id="bgm-seek" type="range" min="0" max="1000" value="0" disabled>
        <span id="bgm-duration" class="time">0:00</span>
      </div>
      <div class="transport">
        <button id="bgm-prev" type="button" class="icon" title="前の曲">⏮</button>
        <button id="bgm-play" type="button" class="icon primary">▶</button>
        <button id="bgm-next" type="button" class="icon" title="次の曲">⏭</button>
        <select id="bgm-loop" title="ループ">
          <option value="all">全体ループ</option>
          <option value="one">1 曲ループ</option>
          <option value="shuffle">シャッフル</option>
        </select>
        <div class="volume">
          <button id="bgm-mute" type="button" class="icon small" title="ミュート">🔊</button>
          <input id="bgm-volume" type="range" min="0" max="100">
          <span id="bgm-volume-value" class="vol-value">50</span>
        </div>
      </div>
      <div class="add-row">
        <button id="bgm-add-file" type="button">＋ ファイル</button>
      </div>
      <ul id="bgm-list" class="playlist" data-empty="ここに音楽ファイルをドラッグ＆ドロップ"></ul>
    </section>
  </main>

  <footer class="statusbar">
    <span id="shortcut-hint"></span>
    <span id="missing-hint" class="missing-hint" hidden></span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings">
      <h2>設定</h2>

      <fieldset>
        <legend>BGM のダッキング（メイン再生中の BGM）</legend>
        <label>動作
          <select id="set-ducking-mode">
            <option value="lower">音量を下げる</option>
            <option value="pause">一時停止する</option>
            <option value="none">何もしない</option>
          </select>
        </label>
        <label>下げたときの音量
          <input id="set-ducking-level" type="range" min="0" max="100">
          <span id="set-ducking-level-value"></span>
        </label>
        <label>フェード時間
          <input id="set-fade" type="number" min="0" max="10" step="0.1"> 秒
        </label>
      </fieldset>

      <fieldset>
        <legend>待機画面（メインを再生していないとき）</legend>
        <div class="row">
          <span id="set-idle-image" class="path">黒い画面</span>
          <button id="set-idle-choose" type="button">画像を選択</button>
          <button id="set-idle-clear" type="button">クリア</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>表示</legend>
        <label class="check"><input id="set-preview" type="checkbox"> 操作画面に出力のプレビューを表示する</label>
        <label class="check"><input id="set-teleop" type="checkbox"> テロップ（タイトル・再生時間）を表示する</label>
      </fieldset>

      <fieldset>
        <legend>データ</legend>
        <div class="row">
          <button id="set-export" type="button">エクスポート</button>
          <button id="set-import" type="button">インポート</button>
        </div>
        <p class="note">設定とプレイリストを JSON ファイルに保存し、別の PC で読み込めます。</p>
        <div class="row">
          <button id="set-relink" type="button">見つからないファイルをフォルダから探す</button>
          <span id="set-missing-count"></span>
        </div>
      </fieldset>

      <div class="actions">
        <button value="close" class="primary">閉じる</button>
      </div>
    </form>
  </dialog>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="control.js"></script>
</body>
</html>
